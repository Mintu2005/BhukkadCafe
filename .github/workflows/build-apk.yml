name: Build Bhukkad Cafe Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          if [ -d "$ANDROID_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            CMDLINE_DIR=$(find "$ANDROID_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$CMDLINE_DIR" ] && [ -d "$CMDLINE_DIR/bin" ]; then
              echo "$CMDLINE_DIR/bin" >> "$GITHUB_PATH"
            fi
          fi
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36"
          if sdkmanager --list 2>/dev/null | grep -q "build-tools;36.0.0"; then
            sdkmanager "build-tools;36.0.0"
          else
            echo "build-tools;36.0.0 is not available in the SDK repository; using installed build-tools version."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-output/Bhukkad Cafe.apk"
          echo "APK successfully generated:"
          ls -la "build-output/Bhukkad Cafe.apk"

      - name: Upload Bhukkad Cafe APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bhukkad-Cafe-APK
          path: "build-output/Bhukkad Cafe.apk"
          retention-days: 30
