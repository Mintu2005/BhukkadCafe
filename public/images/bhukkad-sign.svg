<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="g1" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8ef" />
      <stop offset="60%" stop-color="#f7ecd6" />
      <stop offset="100%" stop-color="#f1e4c8" />
    </radialGradient>
    <linearGradient id="rim" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#111" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#444" stop-opacity="0.95" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- bracket mount (dark metal) -->
  <g transform="translate(150,180)">
    <rect x="-60" y="0" width="1200" height="70" rx="14" fill="#222" opacity="0.95" transform="rotate(-10 540 35)" />
    <rect x="-20" y="60" width="70" height="260" rx="10" fill="#222" opacity="0.95" transform="rotate(-10 15 190)" />
  </g>

  <!-- main sign circle -->
  <g transform="translate(100,120)">
    <circle cx="500" cy="500" r="420" fill="url(#g1)" stroke="url(#rim)" stroke-width="36" filter="url(#softShadow)" />

    <!-- inner subtle ring -->
    <circle cx="500" cy="500" r="360" fill="none" stroke="#efe2c6" stroke-width="6" opacity="0.7" />

    <!-- illustration: messy-haired man biting a burger (dark line-art) -->
    <g transform="translate(180,120) scale(1.05)" stroke="#2b2b2b" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- hair -->
      <path d="M260 200c14-36 46-58 86-56 24 1 42 10 66 18 18 6 34 18 46 32" />
      <path d="M240 220c-6-28 4-58 22-80 12-14 28-20 44-18" />
      <!-- head and cheek -->
      <path d="M300 270a120 120 0 1 1 200 0" />
      <!-- open mouth taking a bite -->
      <path d="M420 320c18 0 56 2 86-6 10-3 20-9 28-16 6-5 10-12 10-20 0-14-14-26-28-28-28-4-58 4-82 16-12 6-22 14-30 24" fill="#2b2b2b" />
      <!-- burger in mouth (line art) -->
      <g transform="translate(420,280) scale(0.9)">
        <rect x="-18" y="-6" width="140" height="28" rx="14" fill="#e6b76d" stroke="#2b2b2b" stroke-width="6" />
        <rect x="-10" y="14" width="124" height="18" rx="9" fill="#523a2a" stroke="#2b2b2b" stroke-width="5" />
        <path d="M0 0c20 8 44 8 64 0" stroke="#2b2b2b" stroke-width="6" fill="none" />
        <path d="M12 -2c6 10 36 10 52 0" stroke="#fff9c9" stroke-width="4" fill="none" opacity="0.9" />
      </g>
      <!-- cheek and jaw -->
      <path d="M380 340c28 18 74 22 110 8" />
      <!-- simple eye -->
      <circle cx="360" cy="240" r="8" fill="#2b2b2b" />
    </g>

    <!-- wordmark: bhukkhad (hand-drawn script) -->
    <g transform="translate(250,560)">
      <text x="0" y="0" font-family="Segoe Script, Brush Script MT, 'Pacifico', 'Comic Sans MS', cursive" font-size="110" fill="#2b2b2b" font-weight="700" letter-spacing="-4">bhukkhad</text>
      <text x="20" y="60" font-family="Inter, Arial, sans-serif" font-size="28" fill="#2b2b2b" letter-spacing="6">— CAFE —</text>

      <!-- coffee cup icon -->
      <g transform="translate(420,-10) scale(0.9)" fill="none" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 30h86a14 14 0 0 0 14-14v-4a2 2 0 0 0-2-2H10v20z" fill="#fff" stroke="#2b2b2b" />
        <path d="M30 6c0-6 20-6 20 0" stroke="#2b2b2b" />
        <path d="M36 2c0-6 16-6 16 0" stroke="#2b2b2b" />
      </g>
    </g>

    <!-- tagline arched along bottom inner curve -->
    <g transform="translate(500,740)">
      <text text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#2b2b2b" letter-spacing="4">• GOOD FOOD, GOOD MOOD •</text>
    </g>
  </g>

</svg>
